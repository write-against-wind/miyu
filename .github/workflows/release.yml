name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check:version
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build -- --publish never
      - name: Verify portable executable
        shell: pwsh
        run: ./scripts/smoke-packaged.ps1 -Portable
      - run: npm run release:metadata
      - name: Publish tagged Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/Miyu-Vault-$version-x64.exe"
          gh release create $env:RELEASE_TAG $exe dist/SHA256SUMS.txt --verify-tag --title "密屿 $env:RELEASE_TAG" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save release test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-report
          path: |
            test-results/*.png
            test-results/*report.json
          if-no-files-found: ignore
          retention-days: 7
